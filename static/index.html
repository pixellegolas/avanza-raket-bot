<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>STEG1 POLARA</title>
<style>:root{--bg:#fdfbf7;--card:#fff;--border:#efe9e0;--text:#1a1a1a;--muted:#9a9a9a;--orange:#ff4d00;--green:#00c853}body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;padding-bottom:100px}.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:16px;margin:12px;box-shadow:0 2px 16px rgba(0,0,0,0.04)}.muted{color:var(--muted);font-size:11px}.btn{padding:12px 16px;border-radius:999px;border:none;font-weight:800;cursor:pointer;font-size:11px}</style>
</head><body>
<div style="background:#111;color:#fff;text-align:center;padding:10px;font-size:11px">POLARA STEG1 • VWAP + ATR + Kelly + Avanza • Budget 10000kr</div>
<div style="padding:16px"><b>AVANZA RAKET BOT • POLARA STEG1</b> <span id="statusText" class="muted">Laddar...</span></div>
<div class="card"><b>WATCHLIST • AKTIER</b> <span class="muted" id="watchlistInfo"></span><div id="watchlistRows">Laddar...</div></div>
<div class="card"><b>RAKETER JUST NU • STEG1</b><div id="raketer">Laddar...</div></div>
<div class="card"><b>KELLY SIZING + ATR STOP</b><div id="kellyInfo" class="muted">Laddar...</div></div>
<div class="card"><button class="btn" style="background:#111;color:#fff" id="scanBtn">STARTA SCAN</button> <span class="muted">VWAP + ATR + Kelly aktiv</span></div>
<script>
async function load(){
  const s=await fetch('/api/status').then(r=>r.json());
  document.getElementById('statusText').innerText=s.status||'OK';
  const wl=s.watchlist_prices||[];
  document.getElementById('watchlistInfo').innerText=`${wl.filter(w=>w.price>0).length}/${wl.length} OK • Kelly aktiv`;
  document.getElementById('watchlistRows').innerHTML=wl.map((w,i)=>`<div style="display:grid;grid-template-columns:1fr 90px 50px;gap:8px;padding:12px 0;border-bottom:1px solid #efe9e0"><div><b>${w.name}</b><br><small class="muted">VWAP ${w.vwap?w.vwap.toFixed(2):'-'} • ATR ${w.atr_pct?w.atr_pct.toFixed(1)+'%':''} • ${w.owners? (w.owners/1000).toFixed(0)+'k ägare':''}</small></div><div>${w.price>0?w.price.toFixed(2)+' kr<br><small style="color:'+(w.change>=0?'green':'red')+'">'+(w.change>=0?'+':'')+w.change.toFixed(1)+'%</small>':''}</div><div><span style="background:${w.score>=60?'#ff4d00':'#faf6f0'};color:${w.score>=60?'#fff':'#9a9a9a'};padding:4px 8px;border-radius:999px">${w.score}</span><br><small>${w.position_size? (w.position_size/1000).toFixed(1)+'k':''}</small></div></div>`).join('');
  const rak=s.raketer||[];
  document.getElementById('raketer').innerHTML=rak.length?rak.map(r=>`<div style="padding:8px 0;border-bottom:1px solid #efe9e0"><b>${r.name}</b> ${r.score}/100 @ ${r.price.toFixed(2)} kr • VWAP ${r.vwap?((r.price/r.vwap-1)*100).toFixed(1)+'% över':''} • ATR stop ${r.stop_loss?r.stop_loss.toFixed(2):''} • Kelly ${(r.position_size/1000).toFixed(1)}k<br><small class="muted">${r.reasons.join(', ')}</small></div>`).join(''):'<span class="muted">Inga raketer över 50 - väntar</span>';
  const kelly=document.getElementById('kellyInfo');
  if(kelly && wl.length) kelly.innerHTML=wl.map(w=>`${w.name}: ${w.score} score • ATR ${w.atr_pct?.toFixed(1)}% • Kelly ${(w.position_size||2000)/1000}k av 10k (bas 2k * score-faktor * ATR-faktor)`).join('<br>');
}
document.getElementById('scanBtn').onclick=()=>{document.getElementById('scanBtn').innerText='SCANNAR STEG1...';fetch('/api/scan-now?force=true').then(r=>r.json()).then(()=>setTimeout(()=>{load();document.getElementById('scanBtn').innerText='STARTA SCAN';},2000));};
load(); setInterval(load,10000);
</script>
</body></html>
