<html><head><meta charset='UTF-8'><title>ULTRA LIGHT</title><style>body{font-family:sans-serif;background:#fdfbf7} .card{background:#fff;border:1px solid #efe9e0;border-radius:24px;padding:16px;margin:12px} .muted{color:#9a9a9a;font-size:11px} .btn{padding:12px;border-radius:999px;border:none;font-weight:800}</style></head><body><div style='background:#111;color:#fff;text-align:center;padding:10px'>ULTRA LIGHT</div><div class='card' id='status'>Laddar...</div><div class='card'><button class='btn' id='ping'>PING lätt</button> <button class='btn' id='scan' style='background:#111;color:#fff'>SCAN tung</button></div><div class='card' id='list'>Laddar...</div><script>async function load(){const s=await fetch('/api/status').then(r=>r.json());document.getElementById('status').innerText=s.status;document.getElementById('list').innerHTML=(s.watchlist_prices||[]).map(w=>w.name+' '+w.price.toFixed(2)+' '+w.score).join('<br>')+'<br><br>'+ (s.raketer||[]).map(r=>r.name+' '+r.score).join('<br>');}document.getElementById('ping').onclick=()=>fetch('/api/ping').then(r=>r.json()).then(d=>alert('PING OK '+d.time+' 0 Yahoo'));document.getElementById('scan').onclick=()=>{fetch('/api/scan-now?force=true').then(r=>r.json()).then(()=>load());};load();</script></body></html>
