<script>
async function loadFixed(){
  try{
    const s=await fetch('/api/status').then(r=>r.json());
    const st=document.getElementById('statusText');
    if(st) st.innerText=s.status||'OK';
    const wl=s.watchlist_prices||[];
    const rows=document.getElementById('watchlistRows');
    if(rows && wl.length){
      rows.innerHTML=wl.map((w,i)=>`<div style="display:grid;grid-template-columns:1fr 90px 50px;gap:8px;padding:12px 0;border-bottom:1px solid var(--border)"><span>${String(i+1).padStart(2,'0')} ${w.name}</span><span>${w.price>0?w.price.toFixed(2)+' kr':''}<br><small style="color:${w.change>=0?'green':'red'}">${w.change? (w.change>=0?'+':'')+w.change.toFixed(1)+'%':''}</small></span><span style="background:${w.score>=50?'#ff4d00':'#faf6f0'};color:${w.score>=50?'#fff':'#9a9a9a'};padding:4px 8px;border-radius:999px">${w.score}</span></div>`).join('');
    }
    const rakDiv=document.getElementById('raketer');
    if(rakDiv){
      const rak=s.raketer||[];
      rakDiv.innerHTML=rak.length?rak.map(r=>`<div><b>${r.name}</b> ${r.score}/100 @ ${r.price.toFixed(2)} - ${r.reasons.join(', ')}</div>`).join(''):'Inga raketer - högsta '+(wl.length?Math.max(...wl.map(w=>w.score)):0);
    }
  }catch(e){console.error(e);}
}
setInterval(loadFixed,5000);
loadFixed();
document.getElementById('scanBtn')?.addEventListener('click',()=>{fetch('/api/scan-now?force=true').then(()=>setTimeout(loadFixed,1500));});
</script>
