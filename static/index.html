<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POLARA FINAL</title>
<style>:root{--bg:#fdfbf7;--card:#fff;--border:#efe9e0;--text:#1a1a1a;--muted:#9a9a9a;--orange:#ff4d00}body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;padding-bottom:100px}.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:16px;margin:12px}.muted{color:var(--muted);font-size:11px}.btn{padding:12px 16px;border-radius:999px;border:none;font-weight:800;cursor:pointer}</style>
</head><body>
<div style="background:#111;color:#fff;text-align:center;padding:10px;font-size:11px">POLARA FINAL • Budget 10000kr • Fixad scoring</div>
<div style="padding:16px"><b>AVANZA RAKET BOT • POLARA</b> <span id="statusText" class="muted">Laddar...</span></div>
<div class="card"><b>WATCHLIST • AKTIER</b> <span class="muted" id="watchlistInfo"></span><div id="watchlistRows">Laddar...</div></div>
<div class="card"><b>RAKETER JUST NU</b><div id="raketer">Laddar...</div></div>
<div class="card"><button class="btn" style="background:#111;color:#fff" id="scanBtn">STARTA SCAN</button> <span class="muted" id="scanInfo"></span></div>
<script>
async function load(){
  const s=await fetch('/api/status').then(r=>r.json());
  document.getElementById('statusText').innerText=s.status;
  const wl=s.watchlist_prices||[];
  document.getElementById('watchlistInfo').innerText=`${wl.filter(w=>w.price>0).length}/${wl.length} priser OK`;
  document.getElementById('watchlistRows').innerHTML=wl.map((w,i)=>`<div style="display:grid;grid-template-columns:1fr 80px 50px;gap:8px;padding:8px 0;border-bottom:1px solid #efe9e0"><span>${String(i+1).padStart(2,'0')} ${w.name}</span><span>${w.price>0?w.price.toFixed(2)+' kr ('+(w.change>=0?'+':'')+w.change.toFixed(1)+'% )':'-'} </span><span style="background:${w.score>=50?'#ff4d00':'#faf6f0'};color:${w.score>=50?'#fff':'#9a9a9a'};padding:2px 8px;border-radius:999px">${w.score}</span></div>`).join('');
  const rak=s.raketer||[];
  document.getElementById('raketer').innerHTML=rak.length?rak.map(r=>`<div><b>${r.name}</b> ${r.score}/100 @ ${r.price.toFixed(2)} - ${r.reasons.join(', ')}</div>`).join(''):'<span class="muted">Inga raketer - högsta score '+(wl.length?Math.max(...wl.map(w=>w.score)):0)+'. Scoring nu mer generös (50 istället för 65) och 6mo data istället för 5d.</span>';
}
document.getElementById('scanBtn').onclick=()=>{document.getElementById('scanBtn').innerText='SCANNAR...';fetch('/api/scan-now?force=true').then(r=>r.json()).then(()=>setTimeout(()=>{load();document.getElementById('scanBtn').innerText='STARTA SCAN';},1500));};
load(); setInterval(load,10000);
</script>
</body></html>
